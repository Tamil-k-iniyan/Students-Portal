<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>{% block title %}Dashboard{% endblock %}</title>

    <!-- Optional CSS (only works if you created static/style.css) -->
    <!-- <link rel="stylesheet" href="{% static 'style.css' %}"> -->

    <!-- Font Awesome (icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body style="font-family: Arial; margin:0;">

<!-- Sidebar -->
<div style="width:200px; height:100vh; background:#2c3e50; color:white; position:fixed; padding:20px;">
    <h2>🎓 Portal</h2>

    <a href="#" style="color:white; display:block; margin:10px 0;">Dashboard</a>
    <a href="#" style="color:white; display:block; margin:10px 0;">Projects</a>
    <a href="{% url 'upload_file' %}" style="color:white; display:block; margin:10px 0;">Upload</a>

    <hr>

    <a href="{% url 'logout' %}" style="color:red;">Logout</a>
</div>

<!-- Main Content -->
<div style="margin-left:220px; padding:20px;">

    <!-- Navbar -->
    <div style="background:#ecf0f1; padding:10px;">
        <h2>Welcome, {{ request.user.username }}</h2>
    </div>

    <!-- Django Messages -->
    {% if messages %}
        {% for message in messages %}
            <div style="background:#d4edda; padding:10px; margin-top:10px;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

</div>

</body>
</html>
