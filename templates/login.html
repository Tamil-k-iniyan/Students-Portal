<!DOCTYPE html>
<html>
<head>
    <title>Login | College Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Font Awesome (already in style.css but included for safety) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="title">
            <i class="fas fa-graduation-cap"></i> Welcome Back!
        </div>

        <!-- Flash messages (if any) -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">
                        <i class="fas fa-info-circle"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email</label>
                <input type="email" name="email" placeholder="your@email.com" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label><i class="fas fa-user-tag"></i> Role</label>
                <select name="role" required>
                    <option value="" disabled selected>– Select your role –</option>
                    <option value="Student">Student</option>
                    <option value="Mentor">Mentor</option>
                    <option value="Coordinator">Coordinator</option>
                    <option value="HOD">HOD</option>
                </select>
            </div>

            <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>

        <!-- Cute footer message -->
        <p style="margin-top: 20px; color: #a0a0c0; font-size: 0.9rem;">
            <i class="fas fa-heart" style="color: #ffb6c1;"></i> 
            learn, grow, shine 
            <i class="fas fa-heart" style="color: #ffb6c1;"></i>
        </p>
    </div>

</body>
</html>
